name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Push the image to Artifact Registry after GCP/WIF recreation"
        required: true
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'gke-gitops-images' }}
  IMAGE_NAME: sample-app

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color

  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" ./app

  push:
    name: Push image (manual deploy)
    runs-on: ubuntu-latest
    needs: [terraform, build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow configuration
        run: |
          : "${PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          : "${REGION:?Set repository variable GCP_REGION or rely on the default}"
          : "${ARTIFACT_REGISTRY_REPOSITORY:?Set repository variable ARTIFACT_REGISTRY_REPOSITORY or rely on the default}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Recreate WIF and set GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_SERVICE_ACCOUNT:?Recreate WIF and set GCP_SERVICE_ACCOUNT}"
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Rebuild Docker image for push
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          docker build -t "${IMAGE_URI}" ./app

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"
